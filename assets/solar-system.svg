<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="FoxyLoon code solar system">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE400"/>
      <stop offset="40%" stop-color="#FF652F"/>
      <stop offset="100%" stop-color="#09131B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orbit { fill:none; stroke:#FF652F; stroke-width:1.2; stroke-dasharray:5 7; opacity:.4; }
    </style>
  </defs>

  <rect width="720" height="720" fill="#09131B"/>
  <!-- stars -->
  <g fill="#FFE400">
    <circle cx="60" cy="80" r="1" opacity=".6"/>
    <circle cx="640" cy="120" r="1.2" opacity=".5"/>
    <circle cx="120" cy="600" r="1" opacity=".6"/>
    <circle cx="600" cy="620" r="1.3" opacity=".5"/>
    <circle cx="300" cy="40" r="1" opacity=".4"/>
    <circle cx="500" cy="680" r="1.1" opacity=".5"/>
    <circle cx="180" cy="200" r="0.8" opacity=".4"/>
    <circle cx="540" cy="520" r="0.9" opacity=".4"/>
  </g>

  <!-- orbits (inclined ellipses) -->
  <g>
    <path id="o1" class="orbit" d="M 450,360 A 90,32 0 1 0 270,360 A 90,32 0 1 0 450,360" transform="rotate(20,360,360)"/>
    <path id="o2" class="orbit" d="M 490,360 A 130,46 0 1 0 230,360 A 130,46 0 1 0 490,360" transform="rotate(-15,360,360)"/>
    <path id="o3" class="orbit" d="M 530,360 A 170,60 0 1 0 190,360 A 170,60 0 1 0 530,360" transform="rotate(35,360,360)"/>
    <path id="o4" class="orbit" d="M 570,360 A 210,74 0 1 0 150,360 A 210,74 0 1 0 570,360" transform="rotate(-25,360,360)"/>
    <path id="o5" class="orbit" d="M 610,360 A 250,88 0 1 0 110,360 A 250,88 0 1 0 610,360" transform="rotate(10,360,360)"/>
    <path id="o6" class="orbit" d="M 650,360 A 290,102 0 1 0 70,360 A 290,102 0 1 0 650,360" transform="rotate(-30,360,360)"/>
  </g>

  <!-- sun -->
  <circle cx="360" cy="360" r="74" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="360" cy="360" r="48" fill="#FF652F"/>
  <circle cx="360" cy="360" r="32" fill="#FFE400"/>
  <text x="360" y="366" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" font-weight="700" fill="#09131B">SUN</text>

  <!-- planets -->
  <!-- JS -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite">
      <mpath href="#o1"/>
    </animateMotion>
    <circle r="15" fill="#FFE400" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#09131B">JS</text>
  </g>
  <!-- PY -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#o2"/>
    </animateMotion>
    <circle r="15" fill="#3776AB" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">PY</text>
  </g>
  <!-- HTML -->
  <g>
    <animateMotion dur="13s" repeatCount="indefinite">
      <mpath href="#o3"/>
    </animateMotion>
    <circle r="15" fill="#E34F26" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" font-weight="700" fill="#fff">HTML</text>
  </g>
  <!-- CSS -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite">
      <mpath href="#o4"/>
    </animateMotion>
    <circle r="15" fill="#1572B6" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">CSS</text>
  </g>
  <!-- C++ -->
  <g>
    <animateMotion dur="19s" repeatCount="indefinite">
      <mpath href="#o5"/>
    </animateMotion>
    <circle r="15" fill="#00599C" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" font-weight="700" fill="#fff">C++</text>
  </g>
  <!-- REACT -->
  <g>
    <animateMotion dur="22s" repeatCount="indefinite">
      <mpath href="#o6"/>
    </animateMotion>
    <circle r="15" fill="#61DAFB" filter="url(#glow)"/>
    <text y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" font-weight="700" fill="#09131B">REACT</text>
  </g>
</svg>
