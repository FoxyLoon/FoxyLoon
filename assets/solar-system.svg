<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="FoxyLoon code solar system">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE400"/>
      <stop offset="40%" stop-color="#FF652F"/>
      <stop offset="100%" stop-color="#09131B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orbit { fill:none; stroke:#FF652F; stroke-width:1; stroke-dasharray:4 6; opacity:.35; }
      .rot { transform-origin: 360px 360px; }
    </style>
  </defs>

  <rect width="720" height="720" fill="#09131B"/>
  <!-- stars -->
  <g fill="#FFE400">
    <circle cx="60" cy="80" r="1" opacity=".6"/>
    <circle cx="640" cy="120" r="1.2" opacity=".5"/>
    <circle cx="120" cy="600" r="1" opacity=".6"/>
    <circle cx="600" cy="620" r="1.3" opacity=".5"/>
    <circle cx="300" cy="40" r="1" opacity=".4"/>
    <circle cx="500" cy="680" r="1.1" opacity=".5"/>
  </g>

  <!-- orbits -->
  <g>
    <circle class="orbit" cx="360" cy="360" r="90"/>
    <circle class="orbit" cx="360" cy="360" r="130"/>
    <circle class="orbit" cx="360" cy="360" r="170"/>
    <circle class="orbit" cx="360" cy="360" r="210"/>
    <circle class="orbit" cx="360" cy="360" r="250"/>
    <circle class="orbit" cx="360" cy="360" r="290"/>
    <circle class="orbit" cx="360" cy="360" r="330"/>
  </g>

  <!-- sun -->
  <circle cx="360" cy="360" r="70" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="360" cy="360" r="46" fill="#FF652F"/>
  <circle cx="360" cy="360" r="30" fill="#FFE400"/>
  <text x="360" y="366" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" font-weight="700" fill="#09131B">SUN</text>

  <!-- planets: each group rotates around center -->
  <!-- r=90 js -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="360 360 360" dur="6s" repeatCount="indefinite"/>
    <circle cx="360" cy="270" r="16" fill="#FFE400"/><text x="360" y="274" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#09131B">JS</text>
    <text x="360" y="242" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">JS</text>
  </g>
  <!-- r=130 python -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="-360 360 360" dur="9s" repeatCount="indefinite"/>
    <circle cx="360" cy="230" r="16" fill="#3776AB"/><text x="360" y="234" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">PY</text>
    <text x="360" y="202" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">PY</text>
  </g>
  <!-- r=170 html -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="360 360 360" dur="12s" repeatCount="indefinite"/>
    <circle cx="360" cy="190" r="16" fill="#E34F26"/><text x="360" y="194" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">HTML</text>
    <text x="360" y="162" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">HTML</text>
  </g>
  <!-- r=210 css -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="-360 360 360" dur="15s" repeatCount="indefinite"/>
    <circle cx="360" cy="150" r="16" fill="#1572B6"/><text x="360" y="154" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">CSS</text>
    <text x="360" y="122" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">CSS</text>
  </g>
  <!-- r=250 cpp -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="360 360 360" dur="18s" repeatCount="indefinite"/>
    <circle cx="360" cy="110" r="16" fill="#00599C"/><text x="360" y="114" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">C++</text>
    <text x="360" y="82" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">C++</text>
  </g>
  <!-- r=290 react -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="-360 360 360" dur="21s" repeatCount="indefinite"/>
    <circle cx="360" cy="70" r="16" fill="#61DAFB"/><text x="360" y="74" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#09131B">REACT</text>
    <text x="360" y="42" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">REACT</text>
  </g>
  <!-- r=330 nodejs -->
  <g class="rot">
    <animateTransform attributeName="transform" type="rotate" from="0 360 360" to="360 360 360" dur="24s" repeatCount="indefinite"/>
    <circle cx="360" cy="30" r="16" fill="#339933"/><text x="360" y="34" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" font-weight="700" fill="#fff">NODE</text>
    <text x="360" y="2" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFE400">NODE</text>
  </g>
</svg>
