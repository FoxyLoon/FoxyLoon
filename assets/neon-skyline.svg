<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="FoxyLoon neon skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="60%" stop-color="#09131B"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF652F"/>
      <stop offset="100%" stop-color="#FFE400"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .twinkle { animation: tw 2.4s ease-in-out infinite; }
      .twinkle2 { animation: tw 3.1s ease-in-out infinite; }
      .blink { animation: bl 1.8s steps(2) infinite; }
      @keyframes tw { 0%,100%{opacity:.2} 50%{opacity:1} }
      @keyframes bl { 0%,100%{opacity:1} 50%{opacity:.3} }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#FFE400">
    <circle cx="80" cy="40" r="1.2" class="twinkle"/>
    <circle cx="220" cy="25" r="1" class="twinkle2"/>
    <circle cx="360" cy="55" r="1.4" class="twinkle"/>
    <circle cx="510" cy="30" r="1" class="twinkle2"/>
    <circle cx="690" cy="45" r="1.3" class="twinkle"/>
    <circle cx="870" cy="20" r="1" class="twinkle2"/>
    <circle cx="1020" cy="50" r="1.4" class="twinkle"/>
    <circle cx="1130" cy="35" r="1" class="twinkle2"/>
  </g>

  <!-- title -->
  <text x="600" y="70" text-anchor="middle" font-family="Fira Code, monospace" font-size="72" font-weight="700" fill="url(#neon)" filter="url(#glow)">FOXYLOON</text>
  <text x="600" y="104" text-anchor="middle" font-family="Fira Code, monospace" font-size="16" fill="#FFE400" letter-spacing="6">THE MYSTIC FOX OF TWELVE TAILS</text>

  <!-- buildings (base at 380, tops shifted down for spacing) -->
  <g>
    <rect x="60" y="210" width="90" height="170" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FFE400" class="blink">
      <rect x="72" y="225" width="8" height="8"/>
      <rect x="92" y="225" width="8" height="8"/>
      <rect x="112" y="225" width="8" height="8"/>
      <rect x="72" y="250" width="8" height="8"/>
      <rect x="112" y="250" width="8" height="8"/>
      <rect x="92" y="275" width="8" height="8"/>
    </g>

    <rect x="170" y="170" width="120" height="210" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FF652F" class="blink">
      <rect x="185" y="185" width="9" height="9"/>
      <rect x="205" y="185" width="9" height="9"/>
      <rect x="225" y="185" width="9" height="9"/>
      <rect x="245" y="185" width="9" height="9"/>
      <rect x="265" y="185" width="9" height="9"/>
      <rect x="185" y="210" width="9" height="9"/>
      <rect x="225" y="210" width="9" height="9"/>
      <rect x="265" y="210" width="9" height="9"/>
      <rect x="205" y="235" width="9" height="9"/>
      <rect x="245" y="235" width="9" height="9"/>
    </g>

    <rect x="310" y="130" width="100" height="250" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FFE400" class="blink">
      <rect x="325" y="145" width="8" height="8"/>
      <rect x="345" y="145" width="8" height="8"/>
      <rect x="365" y="145" width="8" height="8"/>
      <rect x="385" y="145" width="8" height="8"/>
      <rect x="325" y="170" width="8" height="8"/>
      <rect x="365" y="170" width="8" height="8"/>
      <rect x="345" y="195" width="8" height="8"/>
      <rect x="385" y="195" width="8" height="8"/>
    </g>
    <line x1="360" y1="130" x2="360" y2="100" stroke="#FFE400" stroke-width="2" filter="url(#glow)"/>
    <circle cx="360" cy="98" r="3" fill="#FF652F" class="twinkle"/>

    <rect x="430" y="190" width="110" height="190" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FF652F" class="blink">
      <rect x="445" y="205" width="9" height="9"/>
      <rect x="465" y="205" width="9" height="9"/>
      <rect x="485" y="205" width="9" height="9"/>
      <rect x="505" y="205" width="9" height="9"/>
      <rect x="445" y="230" width="9" height="9"/>
      <rect x="485" y="230" width="9" height="9"/>
      <rect x="465" y="255" width="9" height="9"/>
      <rect x="505" y="255" width="9" height="9"/>
    </g>

    <rect x="560" y="160" width="130" height="220" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FFE400" class="blink">
      <rect x="575" y="175" width="10" height="10"/>
      <rect x="595" y="175" width="10" height="10"/>
      <rect x="615" y="175" width="10" height="10"/>
      <rect x="635" y="175" width="10" height="10"/>
      <rect x="655" y="175" width="10" height="10"/>
      <rect x="575" y="200" width="10" height="10"/>
      <rect x="615" y="200" width="10" height="10"/>
      <rect x="655" y="200" width="10" height="10"/>
      <rect x="595" y="225" width="10" height="10"/>
      <rect x="635" y="225" width="10" height="10"/>
    </g>

    <rect x="710" y="220" width="80" height="160" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FF652F" class="blink">
      <rect x="725" y="235" width="8" height="8"/>
      <rect x="745" y="235" width="8" height="8"/>
      <rect x="765" y="235" width="8" height="8"/>
      <rect x="725" y="260" width="8" height="8"/>
      <rect x="765" y="260" width="8" height="8"/>
    </g>

    <rect x="810" y="180" width="120" height="200" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FFE400" class="blink">
      <rect x="825" y="195" width="9" height="9"/>
      <rect x="845" y="195" width="9" height="9"/>
      <rect x="865" y="195" width="9" height="9"/>
      <rect x="885" y="195" width="9" height="9"/>
      <rect x="905" y="195" width="9" height="9"/>
      <rect x="825" y="220" width="9" height="9"/>
      <rect x="865" y="220" width="9" height="9"/>
      <rect x="905" y="220" width="9" height="9"/>
      <rect x="845" y="245" width="9" height="9"/>
      <rect x="885" y="245" width="9" height="9"/>
    </g>

    <rect x="950" y="150" width="100" height="230" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FF652F" class="blink">
      <rect x="965" y="165" width="8" height="8"/>
      <rect x="985" y="165" width="8" height="8"/>
      <rect x="1005" y="165" width="8" height="8"/>
      <rect x="1025" y="165" width="8" height="8"/>
      <rect x="965" y="190" width="8" height="8"/>
      <rect x="1005" y="190" width="8" height="8"/>
      <rect x="985" y="215" width="8" height="8"/>
      <rect x="1025" y="215" width="8" height="8"/>
    </g>

    <rect x="1070" y="210" width="90" height="170" fill="#0d1a26" stroke="url(#neon)" stroke-width="1.5"/>
    <g fill="#FFE400" class="blink">
      <rect x="1085" y="225" width="8" height="8"/>
      <rect x="1105" y="225" width="8" height="8"/>
      <rect x="1125" y="225" width="8" height="8"/>
      <rect x="1085" y="250" width="8" height="8"/>
      <rect x="1125" y="250" width="8" height="8"/>
    </g>
  </g>

  <line x1="0" y1="380" x2="1200" y2="380" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
</svg>
